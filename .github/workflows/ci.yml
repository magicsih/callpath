name: CI

on:
  push:
    branches: [main]
  pull_request:
  # macOS까지 확인해야 하는 브랜치는 손으로 전체 조합을 돌린다
  workflow_dispatch:

jobs:
  test:
    strategy:
      # 한 OS가 실패해도 다른 OS 결과를 끝까지 본다
      fail-fast: false
      matrix:
        # 비공개 저장소의 macOS 러너는 분당 10배 과금이라 PR에서는 ubuntu만, main 반영 때 macOS를 함께 돌린다
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    env:
      # JDT LS를 한 번 내려받아 단위, 통합, E2E 테스트가 함께 쓴다
      CALLPATH_LSP_CACHE: ${{ github.workspace }}/.lsp-cache
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v6
        with:
          path: .lsp-cache/tools
          key: jdtls-1.61.0-${{ runner.os }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 데스크톱 타입 검사가 코어 빌드 결과(d.ts)를 읽으므로 빌드를 먼저 한다
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: 데스크톱 E2E (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm --filter @callpath/desktop exec playwright test
      - name: 데스크톱 E2E (macOS)
        if: runner.os == 'macOS'
        run: pnpm --filter @callpath/desktop exec playwright test
      - name: E2E 실패 화면
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.os }}
          path: apps/desktop/test-results/
          retention-days: 3
