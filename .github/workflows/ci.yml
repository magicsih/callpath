name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      # 한 OS가 실패해도 다른 OS 결과를 끝까지 본다
      fail-fast: false
      matrix:
        # 공개 저장소라 GitHub 호스트 러너가 무료다. PR에서도 macOS를 함께 돌린다(CI macOS 창은 1024x645라 한 열 diff가 기본)
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # JDT LS를 한 번 내려받아 단위, 통합, E2E 테스트가 함께 쓴다
      CALLPATH_LSP_CACHE: ${{ github.workspace }}/.lsp-cache
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v6
        with:
          path: .lsp-cache/tools
          key: jdtls-1.61.0-${{ runner.os }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 데스크톱 타입 검사가 코어 빌드 결과(d.ts)를 읽으므로 빌드를 먼저 한다
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: 데스크톱 E2E (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm --filter @callpath/desktop exec playwright test
      - name: 데스크톱 E2E (macOS)
        if: runner.os == 'macOS'
        run: pnpm --filter @callpath/desktop exec playwright test
      - name: E2E 실패 화면
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.os }}
          path: apps/desktop/test-results/
          retention-days: 3
